[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-migraid"
version = "0.3.0b2"
description = "Detect, diagnose, and auto-fix Django migration problems, circular dependencies, and merge conflicts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = [
    "django",
    "migrations",
    "git",
    "rebase",
    "devtools",
    "circular-dependency",
    "merge-conflict",
    "InconsistentMigrationHistory",
    "renumber",
    "django-migrations",
    "database-sync",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2",
    "libcst>=1.1",
    "rich>=13.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-cov>=4.1",
    "coverage[toml]>=7.3",
    "mypy==1.11.2",
    "ruff>=0.3",
    "django-stubs[compatible-mypy]==5.1.0",
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/AhmedShehab/django-migraid"
Repository = "https://github.com/AhmedShehab/django-migraid"
Documentation = "https://AhmedShehab.github.io/django-migraid"
Changelog = "https://github.com/AhmedShehab/django-migraid/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/migraid"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["migraid"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
strict = true

[[tool.mypy.overrides]]
module = ["git.*", "gitdb.*", "psycopg2.*", "MySQLdb.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
