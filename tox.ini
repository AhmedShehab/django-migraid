[tox]
envlist = py{310,311,312}-django{42,50,51}
isolated_build = true

[testenv]
deps =
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    pytest>=7.4
    pytest-django>=4.7
    coverage[toml]>=7.3
    libcst>=1.1
    rich>=13.0
    gitpython>=3.1
commands =
    coverage run -m pytest {posargs}
    coverage report

[testenv:lint]
deps =
    ruff>=0.3
    mypy>=1.8
    django-stubs[compatible-mypy]>=4.2
commands =
    ruff check src tests
    ruff format --check src tests
    mypy src/migraid
