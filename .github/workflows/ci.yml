name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint deps
        run: pip install ruff "mypy==1.11.2" "django-stubs[compatible-mypy]==5.1.0" Django>=4.2 libcst>=1.1 rich>=13.0 gitpython>=3.1
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: PYTHONPATH=src mypy src/migraid

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        django-version: ["4.2", "5.0", "5.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install "Django~=${{ matrix.django-version }}.0" -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=migraid --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.django-version == '5.1'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --strict -f docs/mkdocs.yml
