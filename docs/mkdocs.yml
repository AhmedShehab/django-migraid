site_name: django-migraid
site_description: Detect, diagnose, and auto-fix Django migration problems in Git workflows
site_url: https://AhmedShehab.github.io/django-migraid
repo_url: https://github.com/AhmedShehab/django-migraid
repo_name: AhmedShehab/django-migraid

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Troubleshooting: troubleshooting.md
  - Known Issues: known-issues.md
  - Updating the migrations table: update-db.md
  - Commands:
      - doctor: commands/doctor.md
      - rebase: commands/rebase.md
      - fix-conflicts: commands/fix-conflicts.md
      - linearize: commands/linearize.md
      - renumber: commands/renumber.md
      - prune: commands/prune.md
      - sync-branch: commands/sync-branch.md
      - graph: commands/graph.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
